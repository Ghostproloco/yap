<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mega Sort Mania - Monolítico</title>
  <style>
:root {
  color-scheme: light dark;
  --bg-main: #f2f5ff;
  --bg-panel: rgba(255,255,255,0.85);
  --bg-panel-contrast: #111;
  --accent: #4a7bff;
  --accent-2: #ff7b4a;
  --danger: #ff4a6a;
  --success: #44c767;
  --text-main: #1f2333;
  --text-contrast: #fafafa;
  --shadow: 0 10px 30px rgba(31,35,51,0.2);
  --ui-scale: 1;
  font-size: calc(16px * var(--ui-scale));
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  font-family: "Segoe UI", Roboto, system-ui, sans-serif;
  background: var(--bg-main);
  color: var(--text-main);
  overflow: hidden;
}
body.is-paused #game-canvas {
  filter: saturate(0.8);
}
body.high-contrast {
  --bg-main: #050505;
  --bg-panel: rgba(0,0,0,0.9);
  --bg-panel-contrast: #f9f9f9;
  --accent: #ffd400;
  --accent-2: #08f;
  --text-main: #fefefe;
  --text-contrast: #000;
  --shadow: 0 0 0 2px #fff;
}
#game-root {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: linear-gradient(180deg, rgba(74,123,255,0.2), rgba(255,255,255,0.5));
}
canvas#game-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
}
.ui-layer {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 1.2rem;
}
.hud {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 0.8rem;
  pointer-events: auto;
}
.hud.is-hidden { display: none; }
.hud-panel {
  background: var(--bg-panel);
  border-radius: 16px;
  padding: 0.8rem 1rem;
  min-width: 180px;
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  gap: 0.6rem;
  transition: transform 0.3s ease;
}
.hud-panel[data-pop="true"] {
  transform: scale(1.05);
}
.hud-panel strong { font-size: 1.1rem; }
.btn {
  pointer-events: auto;
  background: var(--accent);
  color: var(--text-contrast);
  padding: 0.9rem 1.2rem;
  border-radius: 16px;
  font-size: 1.1rem;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  box-shadow: var(--shadow);
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
}
.btn:focus-visible { outline: 3px solid rgba(255,255,255,0.7); outline-offset: 4px; }
.btn:active { transform: scale(0.96); }
.btn.secondary { background: var(--accent-2); }
.btn.danger { background: var(--danger); }
.btn.ghost {
  background: transparent;
  color: var(--text-main);
  box-shadow: none;
  border: 2px solid currentColor;
}
.btn.icon-only {
  padding: 0.8rem;
  min-width: 48px;
  justify-content: center;
}
.power-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.6rem;
  margin-top: 0.6rem;
}
.power-chip {
  padding: 0.6rem 0.8rem;
  font-size: 1.2rem;
}
.power-active {
  background: rgba(255,255,255,0.18);
  border-radius: 12px;
  padding: 0.4rem 0.8rem;
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  font-weight: 600;
}
.power-placeholder {
  font-size: 0.95rem;
  opacity: 0.7;
}
.centered-panel {
  pointer-events: auto;
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: var(--bg-panel);
  padding: 2rem;
  border-radius: 20px;
  box-shadow: var(--shadow);
  width: min(90vw, 480px);
  max-height: 90vh;
  overflow-y: auto;
}
.centered-panel.wide {
  width: min(92vw, 960px);
}
.scene-title {
  font-size: 2rem;
  margin-bottom: 1.2rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.grid-levels {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
  gap: 0.8rem;
}
.level-card {
  background: rgba(74,123,255,0.15);
  border-radius: 16px;
  padding: 0.8rem;
  text-align: center;
  font-weight: 600;
  cursor: pointer;
  border: 2px solid transparent;
}
.level-card.locked { opacity: 0.4; pointer-events: none; }
.news-ticker {
  pointer-events: auto;
  width: 100%;
  overflow: hidden;
  background: rgba(0,0,0,0.12);
  color: var(--text-main);
  border-radius: 12px;
  padding: 0.6rem 1rem;
  margin-top: 1rem;
  font-size: 0.95rem;
  position: relative;
}
.news-ticker span {
  position: absolute;
  white-space: nowrap;
  will-change: transform;
  animation: ticker 12s linear infinite;
}
@keyframes ticker {
  from { transform: translateX(100%); }
  to { transform: translateX(-120%); }
}
.home-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1.5rem;
  align-items: flex-start;
}
.home-card {
  background: var(--bg-panel);
  border-radius: 24px;
  padding: 1.4rem;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  gap: 1rem;
}
.home-card h3 {
  margin: 0;
}
.home-hero {
  margin: 0;
  font-size: 1rem;
  opacity: 0.9;
}
.home-actions-buttons {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 0.8rem;
}
.home-actions-buttons .btn {
  width: 100%;
  justify-content: flex-start;
}
.home-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 0.8rem;
}
.home-stat {
  background: rgba(0,0,0,0.05);
  border-radius: 14px;
  padding: 0.8rem 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
}
.home-stat strong {
  font-size: 1.4rem;
}
.home-card-subsection {
  background: rgba(0,0,0,0.04);
  border-radius: 18px;
  padding: 1rem 1.2rem;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}
.daily-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 0.6rem;
  font-weight: 600;
}
.daily-list {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
}
.daily-list li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0.35rem 0;
  border-bottom: 1px dashed rgba(0,0,0,0.08);
}
.daily-list li:last-child {
  border-bottom: none;
}
.hero-icon {
  font-size: 2.4rem;
}
.toast-container {
  position: absolute;
  bottom: 1rem;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  pointer-events: none;
}
.toast {
  background: rgba(34,34,34,0.85);
  color: white;
  padding: 0.6rem 0.9rem;
  border-radius: 12px;
  min-width: 220px;
  text-align: center;
  box-shadow: var(--shadow);
  opacity: 0;
  animation: toast-in 0.3s ease forwards, toast-out 0.3s ease forwards 2.7s;
}
@keyframes toast-in { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes toast-out { to { opacity: 0; transform: translateY(-20px); } }
.modal-bg {
  pointer-events: auto;
  position: absolute;
  inset: 0;
  background: rgba(15, 18, 30, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
}
.pause-quick {
  background: rgba(0,0,0,0.06);
  border-radius: 18px;
  padding: 1rem 1.2rem;
  display: flex;
  flex-direction: column;
  gap: 0.8rem;
}
.slider-row {
  display: flex;
  align-items: center;
  gap: 1rem;
  font-weight: 600;
}
.slider-wrapper {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  flex: 1;
}
.slider-wrapper input[type="range"] {
  flex: 1;
}
.slider-value {
  font-size: 0.9rem;
  font-weight: 600;
  min-width: 3ch;
  text-align: right;
}
.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.8rem;
  font-weight: 600;
}
.flex-col { display: flex; flex-direction: column; gap: 0.8rem; }
.list {
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
}
.achievement {
  background: rgba(255,255,255,0.25);
  border-radius: 12px;
  padding: 0.8rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.store-item {
  background: rgba(0,0,0,0.08);
  padding: 1rem;
  border-radius: 12px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 0.6rem;
  align-items: center;
}
.settings-group {
  display: grid;
  gap: 0.6rem;
}
label.switch {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.8rem;
  font-weight: 600;
}
label.switch input { accent-color: var(--accent); }
.slider {
  width: 100%;
}
.parallax-layer {
  position: absolute;
  inset: 0;
  background-repeat: repeat;
  background-size: cover;
  opacity: 0.35;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
[data-hidden="true"] { display: none !important; }

@media (max-width: 900px) {
  .home-grid {
    grid-template-columns: 1fr;
  }
}
@media (max-width: 600px) {
  .home-actions-buttons {
    grid-template-columns: 1fr;
  }
}
  </style>
</head>
<body>

    <div class="toast-container" id="toast-container" aria-live="assertive"></div>

  <script>
(() => {
  "use strict";
  const clamp = (v,min,max)=>Math.max(min,Math.min(max,v));
  const lerp = (a,b,t)=>a+(b-a)*t;
  const easeOutBack = (t)=>{const s=1.70158;return 1+--t*t*((s+1)*t+s);};
  const randRange=(rng,min,max)=>rng()* (max-min)+min;
  const categories = [
    { id: 'food', color: '#ffb347', icon: '🍎', label: { es: 'Comida', en: 'Food' } },
    { id: 'electronics', color: '#69a7ff', icon: '🔌', label: { es: 'Electrónica', en: 'Electronics' } },
    { id: 'clothes', color: '#ff69c7', icon: '👕', label: { es: 'Ropa', en: 'Clothes' } },
    { id: 'cleaning', color: '#8ae6ff', icon: '🧼', label: { es: 'Limpieza', en: 'Cleaning' } },
    { id: 'toys', color: '#ffd86b', icon: '🧸', label: { es: 'Juguetes', en: 'Toys' } },
    { id: 'office', color: '#b3ff82', icon: '📎', label: { es: 'Oficina', en: 'Office' } }
  ];

  const dailyChallengeDefinitions = [
    { id: 'perfect5', reward: 120, title: { es: 'Logra 5 aciertos seguidos', en: 'Hit 5 items in a row' } },
    { id: 'combo3', reward: 150, title: { es: 'Consigue combo x3', en: 'Reach x3 combo' } },
    { id: 'cleanTeam', reward: 180, title: { es: 'Limpia 3 objetos sucios', en: 'Clean 3 dirty items' } },
    { id: 'powerTrip', reward: 140, title: { es: 'Activa 2 power-ups', en: 'Trigger 2 power-ups' } },
    { id: 'zenMaster', reward: 200, title: { es: 'Completa un nivel sin errores', en: 'Finish a level without errors' } }
  ];

  const powerUps = {
    freeze: { icon: '❄️', duration: 3000 },
    magnet: { icon: '🧲', duration: 2000 },
    sweep: { icon: '🧹', duration: 0 }
  };

  const defaultSave = () => ({
    version: 1,
    progress: { levels: {} },
    infinite: { bestScore: 0, maxCombo: 0, maxSpeed: 1 },
    settings: {
      lang: navigator.language.startsWith('es') ? 'es' : 'en',
      music: 0.6,
      sfx: 0.8,
      vibration: 'vibrate' in navigator,
      colorBlind: 'none',
      highContrast: false,
      reduceMotion: false,
      uiScale: 1
    },
    inventory: {
      coins: 500,
      skins: {
        glove: ['classic'],
        belt: ['standard'],
        background: ['warehouse']
      },
      equipped: { glove: 'classic', belt: 'standard', background: 'warehouse' }
    },
    achievements: {},
    daily: { date: '', challenges: [] },
    seeds: {}
  });

  class Save {
    constructor() {
      this.key = 'mega-sort-save';
      this.state = defaultSave();
      this.load();
    }
    load() {
      try {
        const raw = localStorage.getItem(this.key);
        if (raw) {
          const data = JSON.parse(raw);
          this.state = Object.assign(defaultSave(), data);
        }
      } catch (err) {
        console.warn('Save load failed', err);
      }
    }
    save() {
      try {
        localStorage.setItem(this.key, JSON.stringify(this.state));
      } catch (err) {
        console.warn('Save write failed', err);
      }
    }
    reset() {
      this.state = defaultSave();
      this.save();
    }
    export() { return JSON.stringify(this.state, null, 2); }
    import(json) {
      try {
        const data = JSON.parse(json);
        if (data && data.version) {
          this.state = Object.assign(defaultSave(), data);
          this.save();
          return true;
        }
      } catch (err) {
        console.warn('Import failed', err);
      }
      return false;
    }
  }

  const I18n = {
    lang: 'es',
    dict: {
      es: {
        'ui.play': 'Jugar',
        'ui.infinite': 'Modo Infinito',
        'ui.levels': 'Niveles',
        'ui.store': 'Tienda',
        'ui.achievements': 'Logros',
        'ui.settings': 'Ajustes',
        'ui.credits': 'Créditos',
        'ui.resume': 'Continuar',
        'ui.restart': 'Reiniciar',
        'ui.quit': 'Salir',
        'ui.tutorial': 'Tutorial',
        'ui.pause': 'Pausa',
        'ui.results': 'Resultados',
        'stat.score': 'Puntuación',
        'stat.combo': 'Combo',
        'stat.time': 'Tiempo',
        'stat.accuracy': 'Precisión',
        'stat.stars': 'Estrellas',
        'settings.language': 'Idioma',
        'settings.music': 'Música',
        'settings.sfx': 'FX',
        'settings.vibration': 'Vibración',
        'settings.colorblind': 'Modo daltónicos',
        'settings.contrast': 'Alto contraste',
        'settings.reduceMotion': 'Reducir movimiento',
        'settings.uiScale': 'Tamaño UI',
        'store.buy': 'Comprar',
        'store.equip': 'Equipar',
        'store.equipped': 'Equipado',
        'ach.unlocked': 'Logro desbloqueado!',
        'daily.challenges': 'Retos diarios',
        'daily.resetIn': 'Reinicio en'
      },
      en: {
        'ui.play': 'Play',
        'ui.infinite': 'Endless Mode',
        'ui.levels': 'Levels',
        'ui.store': 'Store',
        'ui.achievements': 'Achievements',
        'ui.settings': 'Settings',
        'ui.credits': 'Credits',
        'ui.resume': 'Resume',
        'ui.restart': 'Restart',
        'ui.quit': 'Quit',
        'ui.tutorial': 'Tutorial',
        'ui.pause': 'Pause',
        'ui.results': 'Results',
        'stat.score': 'Score',
        'stat.combo': 'Combo',
        'stat.time': 'Time',
        'stat.accuracy': 'Accuracy',
        'stat.stars': 'Stars',
        'settings.language': 'Language',
        'settings.music': 'Music',
        'settings.sfx': 'SFX',
        'settings.vibration': 'Vibration',
        'settings.colorblind': 'Colorblind Mode',
        'settings.contrast': 'High Contrast',
        'settings.reduceMotion': 'Reduce Motion',
        'settings.uiScale': 'UI Size',
        'store.buy': 'Buy',
        'store.equip': 'Equip',
        'store.equipped': 'Equipped',
        'ach.unlocked': 'Achievement unlocked!',
        'daily.challenges': 'Daily Challenges',
        'daily.resetIn': 'Reset in'
      }
    },
    t(key) {
      const lang = this.lang || 'es';
      return (this.dict[lang] && this.dict[lang][key]) || this.dict.es[key] || key;
    },
    setLang(lang) {
      this.lang = lang;
    }
  };

  class AudioManager {
    constructor(save) {
      this.save = save;
      this.ctx = null;
      this.musicGain = null;
      this.fxGain = null;
      this.currentMusic = null;
      this.musicLoopBuffer = null;
    }
    ensureContext() {
      if (!this.ctx) {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.ctx = ctx;
        this.musicGain = ctx.createGain();
        this.fxGain = ctx.createGain();
        this.musicGain.connect(ctx.destination);
        this.fxGain.connect(ctx.destination);
        this.setMusicVolume(this.save.state.settings.music);
        this.setFxVolume(this.save.state.settings.sfx);
        this.createMusicLoop();
      }
    }
    setMusicVolume(v) {
      if (this.musicGain) this.musicGain.gain.value = v;
    }
    setFxVolume(v) {
      if (this.fxGain) this.fxGain.gain.value = v;
    }
    playMusic() {
      this.ensureContext();
      if (!this.musicLoopBuffer) return;
      if (this.currentMusic) return;
      const src = this.ctx.createBufferSource();
      src.buffer = this.musicLoopBuffer;
      src.loop = true;
      src.connect(this.musicGain);
      src.start();
      this.currentMusic = src;
    }
    stopMusic() {
      if (this.currentMusic) {
        this.currentMusic.stop();
        this.currentMusic = null;
      }
    }
    suspend() {
      if (this.ctx && this.ctx.state === 'running') {
        this.ctx.suspend();
      }
    }
    resume() {
      if (this.ctx) {
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
    }
    playSfx(type) {
      this.ensureContext();
      if (!this.ctx) return;
      const ctx = this.ctx;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const now = ctx.currentTime;
      let freq = 440;
      switch (type) {
        case 'ok': freq = 720; break;
        case 'error': freq = 140; break;
        case 'combo': freq = 920; break;
        case 'powerup': freq = 560; break;
      }
      osc.frequency.setValueAtTime(freq, now);
      if (type === 'combo') {
        osc.frequency.linearRampToValueAtTime(freq*1.5, now+0.12);
      }
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(0.3, now+0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, now+0.25);
      osc.type = type === 'error' ? 'sawtooth' : 'triangle';
      osc.connect(gain);
      gain.connect(this.fxGain);
      osc.start();
      osc.stop(now+0.3);
    }
    createMusicLoop() {
      this.ensureContext();
      const ctx = this.ctx;
      const bpm = 80;
      const beat = 60 / bpm;
      const bars = 8;
      const duration = beat * 4 * bars;
      const sampleRate = ctx.sampleRate;
      const buffer = ctx.createBuffer(2, duration*sampleRate, sampleRate);
      for (let ch=0; ch<2; ch++) {
        const data = buffer.getChannelData(ch);
        for (let i=0; i<data.length; i++) {
          const t = i / sampleRate;
          const kickPhase = (t % beat) / beat;
          const kick = Math.pow(1 - kickPhase, 4) * 0.5;
          const bassFreq = 55;
          const bass = Math.sin(2*Math.PI*bassFreq*t) * 0.15;
          const pluckFreq = [220,330,440,330][Math.floor(t/(beat/2))%4];
          const pluckEnv = Math.max(0,1-((t%(beat/2))/(beat/2)));
          const pluck = Math.sin(2*Math.PI*pluckFreq*t) * pluckEnv * 0.15;
          data[i] = kick + bass + pluck;
        }
      }
      this.musicLoopBuffer = buffer;
    }
  }

  class ParticleSystem {
    constructor() {
      this.particles = [];
      this.pool = [];
    }
    spawn(type, x, y, color) {
      for (let i=0;i<18;i++) {
        const p = this.pool.pop() || {};
        p.x = x;
        p.y = y;
        p.vx = randRange(Math.random, -2, 2);
        p.vy = randRange(Math.random, -3, -1);
        p.life = 0;
        p.maxLife = 500 + Math.random()*300;
        p.type = type;
        p.color = color || '#fff';
        this.particles.push(p);
      }
    }
    update(dt) {
      for (let i=this.particles.length-1;i>=0;i--) {
        const p = this.particles[i];
        p.life += dt;
        p.x += p.vx * dt/16;
        p.y += p.vy * dt/16;
        p.vy += 0.01 * dt;
        if (p.life >= p.maxLife) {
          this.pool.push(p);
          this.particles.splice(i,1);
        }
      }
    }
    render(ctx) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (const p of this.particles) {
        ctx.globalAlpha = 1 - (p.life/p.maxLife);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }

  class Input {
    constructor(canvas) {
      this.canvas = canvas;
      this.activePointer = null;
      this.onDown = null;
      this.onMove = null;
      this.onUp = null;
      this.onKeyDown = null;
      this.flickThreshold = 0.55;
      canvas.addEventListener('pointerdown', this.handleDown.bind(this));
      window.addEventListener('pointermove', this.handleMove.bind(this));
      window.addEventListener('pointerup', this.handleUp.bind(this));
      window.addEventListener('keydown', (ev)=>{
        if (this.onKeyDown) this.onKeyDown(ev);
      });
    }
    normalize(ev) {
      const rect = this.canvas.getBoundingClientRect();
      const scaleX = this.canvas.width / rect.width;
      const scaleY = this.canvas.height / rect.height;
      return {
        id: ev.pointerId,
        x: (ev.clientX - rect.left) * scaleX,
        y: (ev.clientY - rect.top) * scaleY,
        originalEvent: ev
      };
    }
    handleDown(ev) {
      const p = this.normalize(ev);
      this.activePointer = { ...p, history: [{ x: p.x, y: p.y, t: performance.now() }] };
      this.onDown && this.onDown(p);
    }
    handleMove(ev) {
      if (!this.activePointer) return;
      const p = this.normalize(ev);
      this.activePointer.history.push({ x: p.x, y: p.y, t: performance.now() });
      this.activePointer.x = p.x;
      this.activePointer.y = p.y;
      this.onMove && this.onMove(p);
    }
    handleUp(ev) {
      if (!this.activePointer) return;
      const history = this.activePointer.history;
      const last = history[history.length-1];
      const first = history[0];
      const dt = Math.max(16, last.t - first.t);
      const speed = Math.hypot(last.x-first.x, last.y-first.y) / dt;
      const flick = speed > this.flickThreshold;
      const p = this.normalize(ev);
      this.onUp && this.onUp({ ...p, flick, vx: flick ? (last.x-first.x)/dt*16 : 0, vy: flick ? (last.y-first.y)/dt*16 : 0 });
      this.activePointer = null;
    }
  }

  class SeededRandom {
    constructor(seed=1) {
      this.seed = seed;
    }
    next() {
      this.seed |= 0;
      this.seed = (this.seed + 0x6D2B79F5) | 0;
      let t = Math.imul(this.seed ^ this.seed >>> 15, 1 | this.seed);
      t = (t + Math.imul(t ^ t >>> 7, 61 | t)) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
  }

  class AILevelDirector {
    constructor(seed, save, prefs) {
      this.rng = new SeededRandom(seed || Math.floor(Math.random()*2**32));
      this.save = save;
      this.prefs = prefs;
      this.skillRating = 1200;
      this.recentErrors = 0;
    }
    seededRandom() { return this.rng.next(); }
    adjustAfterOutcome(outcome) {
      const perf = outcome.accuracy * 0.6 + (1-outcome.pace) * 0.4;
      if (outcome.errors > 2) {
        this.recentErrors += outcome.errors;
      } else {
        this.recentErrors = Math.max(0, this.recentErrors-1);
      }
      this.skillRating = clamp(this.skillRating + (perf - 0.5) * 40, 800, 2000);
    }
    baseDifficulty(level, mode) {
      const skillFactor = (this.skillRating - 800) / 1200;
      if (mode === 'infinite') {
        return 0.4 + Math.log(level+1)/4 + skillFactor*0.5;
      }
      return 0.2 + level * 0.05 + skillFactor*0.3;
    }
    composeWavePlan({ level, mode, skillRating, screen }) {
      const diff = clamp(this.baseDifficulty(level, mode) + (skillRating-1200)/1200, 0.2, 1.5);
      const duration = clamp(18 - diff*6, 8, 18);
      const beltSpeed = clamp(160 + diff*120, 140, 360);
      const spawnRate = clamp(1.1 - diff*0.3, 0.35, 1.4);
      const spawns = [];
      let t = 0.8;
      const rng = () => this.rng.next();
      const catCount = Math.min(categories.length, 3 + Math.floor(diff*2));
      const catPool = categories.slice(0).sort(()=>rng()-0.5).slice(0, catCount);
      while (t < duration) {
        const category = catPool[Math.floor(rng()*catPool.length)];
        const tags = [];
        if (rng() < 0.25+diff*0.1) tags.push(['fragil','liquido','pesado'][Math.floor(rng()*3)]);
        const decoy = rng() < clamp(0.1 + diff*0.2, 0, 0.6);
        const obstacles = [];
        if (rng() < diff*0.3) obstacles.push('sealed');
        if (rng() < diff*0.2) obstacles.push('dirty');
        let powerupDrop = undefined;
        if (rng() < clamp(0.05 + (0.6-diff)*0.15, 0.02, 0.3)) {
          powerupDrop = ['freeze','magnet','sweep'][Math.floor(rng()*3)];
        }
        spawns.push({ t, category: category.id, tags, decoy, obstacles, powerupDrop });
        t += spawnRate + rng()*spawnRate*0.25;
      }
      if (this.recentErrors > 3) {
        spawns.push({ t: t+0.5, category: catPool[0].id, tags: [], decoy: false, obstacles: [], powerupDrop: 'freeze' });
        this.recentErrors = 0;
      }
      return { duration, beltSpeed, spawns };
    }
    nextWave(context) {
      const plan = this.composeWavePlan(context);
      return plan;
    }
  }

  class Item {
    constructor(data, sprite) {
      this.data = data;
      this.sprite = sprite;
      this.x = 0;
      this.y = 0;
      this.vx = 0;
      this.vy = 0;
      this.width = 80;
      this.height = 80;
      this.dragging = false;
      this.state = 'belt';
      this.opened = !data.obstacles.includes('sealed');
      this.cleaned = !data.obstacles.includes('dirty');
    }
    update(dt) {
      if (!this.dragging) {
        this.x -= this.vx * dt/16;
        this.y -= this.vy * dt/16;
      }
    }
    render(ctx) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.fillStyle = this.sprite.color;
      ctx.strokeStyle = '#111';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(-this.width/2, -this.height/2, this.width, this.height, 16);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#000';
      ctx.font = '24px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(this.sprite.icon, 0, -4);
      if (!this.opened) {
        ctx.strokeStyle = '#fff';
        ctx.setLineDash([6,6]);
        ctx.strokeRect(-this.width/2+8, -this.height/2+8, this.width-16, this.height-16);
        ctx.setLineDash([]);
      }
      if (!this.cleaned) {
        ctx.fillStyle = 'rgba(80,80,80,0.4)';
        ctx.beginPath();
        ctx.arc(0,0,28,0,Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    }
  }

  class Bin {
    constructor(cfg) {
      this.cfg = cfg;
      this.x = 0;
      this.y = 0;
      this.width = 140;
      this.height = 140;
      this.active = true;
      this.popTimer = 0;
    }
    contains(item) {
      const overlapX = Math.max(0, Math.min(item.x + item.width/2, this.x + this.width/2) - Math.max(item.x - item.width/2, this.x - this.width/2));
      const overlapY = Math.max(0, Math.min(item.y + item.height/2, this.y + this.height/2) - Math.max(item.y - item.height/2, this.y - this.height/2));
      const area = overlapX * overlapY;
      return area > (item.width*item.height*0.4);
    }
    render(ctx) {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.fillStyle = this.cfg.color;
      ctx.globalAlpha = this.active ? 0.9 : 0.4;
      ctx.beginPath();
      ctx.roundRect(-this.width/2, -this.height/2, this.width, this.height, 24);
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.font = '36px sans-serif';
      ctx.fillStyle = '#111';
      ctx.textAlign = 'center';
      ctx.fillText(this.cfg.icon, 0, -18);
      ctx.font = '18px sans-serif';
      ctx.fillText(this.cfg.label[I18n.lang], 0, 44);
      ctx.restore();
    }
  }

  class PowerUp {
    constructor(type) {
      this.type = type;
      this.active = false;
      this.remaining = 0;
    }
    trigger(duration) {
      this.active = true;
      this.remaining = duration;
    }
    update(dt) {
      if (this.active) {
        this.remaining -= dt;
        if (this.remaining <= 0) {
          this.active = false;
          this.remaining = 0;
        }
      }
    }
  }

  class Spawner {
    constructor(director) {
      this.director = director;
      this.currentPlan = null;
      this.time = 0;
      this.index = 0;
    }
    start(plan) {
      this.currentPlan = plan;
      this.time = 0;
      this.index = 0;
    }
    update(dt, spawnCb) {
      if (!this.currentPlan) return;
      this.time += dt/1000;
      const spawns = this.currentPlan.spawns;
      while (this.index < spawns.length && this.time >= spawns[this.index].t) {
        spawnCb(spawns[this.index]);
        this.index++;
      }
    }
    done() {
      return this.currentPlan && this.time > this.currentPlan.duration;
    }
  }

  class SceneManager {
    constructor(game) {
      this.game = game;
      this.scenes = new Map();
      this.current = null;
      this.currentId = null;
    }
    add(id, scene) { this.scenes.set(id, scene); }
    go(id, data) {
      if (this.current && this.current.exit) this.current.exit();
      this.currentId = id;
      this.current = this.scenes.get(id);
      if (this.current && this.current.enter) this.current.enter(data);
    }
    update(dt) { if (this.current && this.current.update) this.current.update(dt); }
    render(ctx) { if (this.current && this.current.render) this.current.render(ctx); }
  }

      panel.append(group, importBtn, exportBtn, resetBtn);
      const back = document.createElement('button');
      back.className='btn ghost';

    showPause(game) {
      this.hidePause();
      const modal = document.createElement('div');
      modal.className='modal-bg pause-modal';
      const panel = document.createElement('div');
      panel.className='centered-panel flex-col';

      const options = [
        { id: 'resume', label: I18n.t('ui.resume'), cls: 'btn' },

        const btn = document.createElement('button');

      const createSlider = (label, value, min, max, step, onInput) => {
        const row = document.createElement('label');
        row.className='slider-row';
        const spanLabel = document.createElement('span');
        spanLabel.textContent = label;
        const wrapper = document.createElement('div');
        wrapper.className='slider-wrapper';
        const range = document.createElement('input');
        range.type='range';
        range.min=min; range.max=max; range.step=step; range.value=value;
        const valueLabel = document.createElement('span');
        valueLabel.className='slider-value';

        range.addEventListener('input',(ev)=>{
          const v = parseFloat(ev.target.value);
          valueLabel.textContent = Math.round(v*100)+'%';
          onInput(v);
        });
        wrapper.append(range,valueLabel);
        row.append(spanLabel, wrapper);
        quick.append(row);

      createSlider(I18n.t('settings.music'), game.save.state.settings.music, 0, 1, 0.01, (v)=>game.setMusicVolume(v));

      const toggles = [

      if (modal) modal.remove();

  class Toasts {
    constructor(container, audio) {
      this.container = container;
      this.audio = audio;
    }
    push(message) {
      const toast = document.createElement('div');
      toast.className='toast';
      toast.textContent=message;
      this.container.append(toast);
      setTimeout(()=>toast.remove(), 3200);
    }
  }

  function generateSpriteAtlas() {
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 256;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    const frames = {};
    categories.forEach((cat, idx) => {
      const x = (idx%6)*80;
      const y = Math.floor(idx/6)*80;
      ctx.fillStyle = cat.color;
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.roundRect(x+8,y+8,64,64,16);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#111';
      ctx.font = '32px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(cat.icon, x+40, y+40);
      frames[cat.id] = { x, y, w: 80, h: 80 };
    });
    return { dataURL: canvas.toDataURL('image/png'), frames };
  }

  function createParallaxLayers() {
    const back = document.getElementById('parallax-back');
    const mid = document.getElementById('parallax-mid');
    const svgBack = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><rect width="800" height="600" fill="#b8c6ff"/><g fill="rgba(255,255,255,0.35)"><rect x="50" y="80" width="120" height="320" rx="22"/><rect x="250" y="140" width="110" height="260" rx="18"/><rect x="420" y="100" width="160" height="340" rx="26"/></g></svg>`;
    const svgMid = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><rect width="800" height="600" fill="rgba(255,255,255,0)"/><g stroke="#8899ff" stroke-width="6" stroke-linecap="round"><line x1="40" y1="120" x2="200" y2="120"/><line x1="240" y1="220" x2="460" y2="220"/><line x1="520" y1="180" x2="760" y2="180"/></g></svg>`;
    back.style.backgroundImage = `url('data:image/svg+xml;base64,${btoa(svgBack)}')`;
    mid.style.backgroundImage = `url('data:image/svg+xml;base64,${btoa(svgMid)}')`;
  }

  class Game {
    constructor() {
      this.canvas = document.getElementById('game-canvas');
      this.ctx = this.canvas.getContext('2d');
      this.uiRoot = document.getElementById('ui-layer');
      this.toasts = new Toasts(document.getElementById('toast-container'));
      this.save = new Save();
      this.ensureDailyChallenges();
      I18n.setLang(this.save.state.settings.lang);
      this.audio = new AudioManager(this.save);
      this.ui = new UIManager(this.uiRoot);
      this.sceneManager = new SceneManager(this);
      this.particles = new ParticleSystem();
      this.input = new Input(this.canvas);
      this.director = new AILevelDirector(parseInt(this.save.state.seeds['global']||Date.now()), this.save, this.save.state.settings);
      this.spawner = new Spawner(this.director);
      this.conveyor = new Conveyor();
      this.items = [];
      this.bins = categories.map((cat, idx)=>{ const bin = new Bin(cat); return bin; });
      this.powerInventory = [];
      this.activePower = null;
      this.combo = 0;
      this.comboTimer = 0;
      this.comboMultiplier = 1;
      this.score = 0;
      this.errors = 0;
      this.hits = 0;
      this.timeLeft = 60;
      this.currentLevel = 1;
      this.mode = 'level';
      this.seed = Date.now();
      this.paused = false;
      this.pauseReason = null;
      this.tutorialStep = 0;
      this.recentHoverBin = null;
      this.spriteAtlas = generateSpriteAtlas();
      this.hudElements = null;
      this.powerDirty = true;
      this.setupScenes();
      this.resize();
      window.addEventListener('resize', ()=>this.resize());
      this.lastFrame = performance.now();
      requestAnimationFrame(this.loop.bind(this));
      this.input.onDown = (p)=>this.handlePointerDown(p);
      this.input.onMove = (p)=>this.handlePointerMove(p);
      this.input.onUp = (p)=>this.handlePointerUp(p);
      this.input.onKeyDown = (ev)=>{
        if (this.sceneManager.currentId === 'play' && (ev.key === 'Escape' || ev.key === 'Pause')) {
          ev.preventDefault();
          this.togglePause();
        }
      };
      this.debug = { overlay: null, visible: false };
      window.addEventListener('keydown', (ev)=>{
        if (ev.key === '`') this.toggleDebug();
      });
      this.setupParallax();
      this.initGame();
    }
    initGame() {
      this.ui.showSplash(()=>{
        this.sceneManager.go('home');
      });
    }
    setupParallax() {
      createParallaxLayers();
    }
    resize() {
      const ratio = 16/9;
      const width = window.innerWidth;
      const height = window.innerHeight;
      let canvasWidth = width;
      let canvasHeight = Math.round(width/ratio);
      if (canvasHeight > height) {
        canvasHeight = height;
        canvasWidth = Math.round(height*ratio);
      }
      this.canvas.style.width = `${canvasWidth}px`;
      this.canvas.style.height = `${canvasHeight}px`;
    }
    setupScenes() {
      this.sceneManager.add('home', {
        enter: ()=>{ this.audio.playMusic(); this.ui.showHome(this); this.ui.setHidden(false); this.mode='menu'; },
        exit: ()=>{}
      });
      this.sceneManager.add('levels', {
        enter: ()=>{ this.ui.showLevels(this); },
        exit: ()=>{}
      });
      this.sceneManager.add('infinite', {
        enter: ()=>{ this.ui.showInfinite(this); },
        exit: ()=>{}
      });
      this.sceneManager.add('store', {
        enter: ()=>{ this.ui.showStore(this); },
        exit: ()=>{}
      });
      this.sceneManager.add('achievements', {
        enter: ()=>{ this.ui.showAchievements(this); },
        exit: ()=>{}
      });
      this.sceneManager.add('settings', {
        enter: ()=>{ this.ui.showSettings(this); this.applySettings(); },
        exit: ()=>{}
      });
      this.sceneManager.add('credits', {
        enter: ()=>{ this.ui.showCredits(this); },
        exit: ()=>{}
      });
      this.sceneManager.add('play', {
        enter: ()=>{ this.startRun(); },
        exit: ()=>{}
      });
      this.sceneManager.add('results', {
        enter: (data)=>{ this.ui.showResults(this, data); },
        exit: ()=>{}
      });
    }
    applySettings() {
      const settings = this.save.state.settings;
      document.body.classList.toggle('high-contrast', !!settings.highContrast);
      document.documentElement.style.setProperty('--ui-scale', settings.uiScale);
      this.audio.setMusicVolume(settings.music);
      this.audio.setFxVolume(settings.sfx);
      document.getElementById('parallax-back').style.opacity = settings.reduceMotion ? '0' : '0.3';
      document.getElementById('parallax-mid').style.opacity = settings.reduceMotion ? '0' : '0.4';
    }
    ensureDailyChallenges() {
      const daily = this.save.state.daily;
      const today = new Date();
      const key = today.toISOString().slice(0,10);
      if (daily.date === key && Array.isArray(daily.challenges) && daily.challenges.length >= 3) {
        return;
      }
      const rngSeed = parseInt(key.replace(/-/g,''), 10) || Date.now();
      const rng = new SeededRandom(rngSeed);
      const pool = dailyChallengeDefinitions.slice();
      const picks = [];
      while (picks.length < 3 && pool.length) {
        const idx = Math.floor(rng.next()*pool.length);
        const [choice] = pool.splice(idx,1);
        picks.push({ id: choice.id, reward: choice.reward, done: false });
      }
      daily.date = key;
      daily.challenges = picks;
      this.save.save();
    }
    getDailyResetCountdown() {
      const now = new Date();
      const reset = new Date(now);
      reset.setHours(24, 0, 0, 0);
      const diff = Math.max(0, reset - now);
      const hours = Math.floor(diff / 3600000);
      const minutes = Math.floor((diff % 3600000) / 60000);
      return `${String(hours).padStart(2,'0')}h ${String(minutes).padStart(2,'0')}m`;
    }
    updateLanguage(lang) {
      this.save.state.settings.lang = lang;
      I18n.setLang(lang);
      this.save.save();
      this.sceneManager.go('home');
    }
    updateToggle(key, value) {
      this.save.state.settings[key] = value;
      this.save.save();
      this.applySettings();
    }
    updateUiScale(scale) {
      this.save.state.settings.uiScale = scale;
      this.save.save();
      this.applySettings();
      this.sceneManager.go('settings');
    }
    setMusicVolume(v) {
      this.save.state.settings.music = v;
      this.save.save();
      this.audio.setMusicVolume(v);
    }
    setFxVolume(v) {
      this.save.state.settings.sfx = v;
      this.save.save();
      this.audio.setFxVolume(v);
    }
    importSave() {
      const json = prompt('Pega el JSON de guardado');
      if (json && this.save.import(json)) {
        this.toasts.push('Guardado importado');
        this.applySettings();
        this.sceneManager.go('home');
      }
    }
    exportSave() {
      const data = this.save.export();
      navigator.clipboard?.writeText(data);
      this.toasts.push('Guardado copiado al portapapeles');
    }
    handleMainMenu(action) {
      switch (action) {
        case 'tutorial': this.startTutorial(); break;
        case 'levels': this.sceneManager.go('levels'); break;
        case 'infinite': this.sceneManager.go('infinite'); break;
        case 'store': this.sceneManager.go('store'); break;
        case 'achievements': this.sceneManager.go('achievements'); break;
        case 'settings': this.sceneManager.go('settings'); break;
        case 'credits': this.sceneManager.go('credits'); break;
      }
    }
    startTutorial() {
      this.mode = 'tutorial';
      this.currentLevel = 0;
      this.sceneManager.go('play');
    }
    startLevel(level) {
      this.mode = 'level';
      this.currentLevel = level;
      this.sceneManager.go('play');
    }
    startInfinite() {
      this.mode = 'infinite';
      this.currentLevel = 1;
      this.sceneManager.go('play');
    }
    handleStore(item) {
      const type = item.type;
      const skinId = item.id.split('_')[1];
      const inventory = this.save.state.inventory;
      const owned = inventory.skins[type]?.includes(skinId);
      if (owned) {
        inventory.equipped[type] = skinId;
        this.toasts.push('Equipado!');
      } else if (inventory.coins >= item.price) {
        inventory.coins -= item.price;
        inventory.skins[type] = inventory.skins[type] || [];
        inventory.skins[type].push(skinId);
        inventory.equipped[type] = skinId;
        this.toasts.push('Comprado!');
      } else {
        this.toasts.push('Monedas insuficientes');
      }
      this.save.save();
      this.sceneManager.go('store');
    }
    startRun() {
      this.ui.clear();
      this.ui.setHidden(true);
      this.applySettings();
      this.paused = false;
      this.pauseReason = null;
      document.body.classList.remove('is-paused');
      this.ui.hidePause();
      this.audio.resume();
      this.audio.playMusic();
      this.items = [];
      this.powerInventory = [];
      this.powerDirty = true;
      this.updatePowerRow();
      this.activePower = null;
      this.combo = 0;
      this.comboMultiplier = 1;
      this.score = 0;
      this.errors = 0;
      this.hits = 0;
      this.timeLeft = this.mode==='infinite'?999:60;
      this.seed = Date.now();
      const skill = this.director.skillRating;
      const wave = this.director.nextWave({ level: this.currentLevel, mode: this.mode==='infinite'?'infinite':'level', skillRating: skill, screen: { w: this.canvas.width, h: this.canvas.height } });
      this.spawner.start(wave);
      this.conveyor.speed = wave.beltSpeed;
      const width = this.canvas.width;
      const spacing = width / (this.bins.length + 1);
      this.bins.forEach((bin, idx)=>{
        bin.x = spacing*(idx+1);
        bin.y = this.canvas.height - 140;
        bin.popTimer = 0;
      });
      if (this.mode==='tutorial') {
        this.timeLeft = 999;
        this.tutorialStep = 0;
        this.toasts.push('Arrastra el objeto al contenedor correcto');
      }
    }
    handlePause(action) {
      switch(action) {
        case 'resume': this.setPaused(false); break;
        case 'restart': this.setPaused(false); this.sceneManager.go('play'); break;
        case 'quit': this.setPaused(false); this.sceneManager.go('home'); break;
      }
    }
    handlePointerDown(p) {
      if (this.sceneManager.currentId !== 'play' || this.paused) return;
      for (let i=this.items.length-1;i>=0;i--) {
        const item = this.items[i];
        if (p.x > item.x-item.width/2 && p.x < item.x+item.width/2 && p.y > item.y-item.height/2 && p.y < item.y+item.height/2) {
          item.dragging = true;
          item.offsetX = p.x - item.x;
          item.offsetY = p.y - item.y;
          break;
        }
      }
    }
    handlePointerMove(p) {
      if (this.sceneManager.currentId !== 'play') return;
      for (const item of this.items) {
        if (item.dragging) {
          item.x = p.x - item.offsetX;
          item.y = p.y - item.offsetY;
          if (this.activePower && this.activePower.type==='magnet' && this.activePower.active) {
            const targetBin = this.bins.find(b=>b.cfg.id===item.data.category);
            if (targetBin) {
              item.x = lerp(item.x, targetBin.x, 0.2);
              item.y = lerp(item.y, targetBin.y-60, 0.2);
            }
          }
        }
      }
    }
    handlePointerUp(p) {
      if (this.sceneManager.currentId !== 'play' || this.paused) return;
      for (const item of this.items) {
        if (item.dragging) {
          item.dragging = false;
          if (p.flick) {
            item.vx = p.vx;
            item.vy = p.vy;
          }
          if (!item.opened) {
            item.opened = true;
            this.toasts.push('¡Caja abierta!');
            return;
          }
          if (!item.cleaned) {
            item.cleaned = true;
            this.toasts.push('¡Objeto limpio!');
            return;
          }
          const bin = this.bins.find(b=>b.contains(item));
          if (bin) {
            this.resolveDrop(item, bin);
          } else {
            this.failDrop(item);
          }
        }
      }
    }
    resolveDrop(item, bin) {
      if (bin.cfg.id === item.data.category) {
        this.score += 100 + this.combo*10;
        this.hits++;
        this.combo++;
        this.comboTimer = 0;
        this.comboMultiplier = 1 + Math.floor(this.combo/5);
        this.particles.spawn('ok', bin.x, bin.y-40, bin.cfg.color);
        this.audio.playSfx('ok');
        this.items.splice(this.items.indexOf(item),1);
        if (navigator.vibrate && this.save.state.settings.vibration) navigator.vibrate(15);
        bin.popTimer = 400;
        if (this.combo > 0 && this.combo % 10 === 0) {
          this.grantPower();
          this.toasts.push('Power-up listo!');
        }
      } else {
        this.failDrop(item);
      }
    }
    failDrop(item) {
      this.errors++;
      this.combo = 0;
      this.comboMultiplier = 1;
      this.score = Math.max(0, this.score - 150);
      this.audio.playSfx('error');
      this.particles.spawn('error', item.x, item.y, '#ff3b3b');
      if (navigator.vibrate && this.save.state.settings.vibration) navigator.vibrate([40,60,40]);
      item.x = 40 + Math.random()*80;
      item.y = this.canvas.height - 220;
    }
    grantPower() {
      const freeSlot = this.powerInventory.length < 3;
      if (!freeSlot) return;
      const type = ['freeze','magnet','sweep'][Math.floor(Math.random()*3)];
      this.powerInventory.push(new PowerUp(type));
      this.powerDirty = true;
      this.updatePowerRow();
    }
    activatePower(index) {
      const power = this.powerInventory[index];
      if (!power) return;
      this.activePower = power;
      this.powerDirty = true;
      power.trigger(powerUps[power.type].duration || 2000);
      if (power.type==='freeze') {
        this.conveyor.speed *= 0.2;
        setTimeout(()=>{ this.conveyor.speed *= 5; }, powerUps.freeze.duration);
      }
      if (power.type==='sweep') {
        let count = 0;
        const interval = setInterval(()=>{
          if (this.items.length === 0 || count>=3) { clearInterval(interval); return; }
          const item = this.items[0];
          const target = this.bins.find(b=>b.cfg.id===item.data.category);
          if (target) {
            item.x = target.x;
            item.y = target.y-40;
            this.resolveDrop(item, target);
          }
          count++;
        }, 300);
      }
      this.powerInventory.splice(index,1);
      this.powerDirty = true;
      this.audio.playSfx('powerup');
      this.updatePowerRow();
    }
    setPaused(flag, reason='user') {
      if (this.sceneManager.currentId !== 'play') {
        if (!flag) {
          this.paused = false;
          this.pauseReason = null;
          document.body.classList.remove('is-paused');
          this.ui.hidePause();
        }
        return;
      }
      if (this.paused === flag) {
        if (!flag) {
          document.body.classList.remove('is-paused');
          this.ui.hidePause();
          this.audio.resume();
        }
        return;
      }
      this.paused = flag;
      this.pauseReason = flag ? reason : null;
      document.body.classList.toggle('is-paused', flag);
      if (flag) {
        this.audio.suspend();
        this.ui.showPause(this);
      } else {
        this.ui.hidePause();
        this.audio.resume();
        this.lastFrame = performance.now();
      }
    }
    togglePause() {
      if (this.sceneManager.currentId !== 'play') return;
      this.setPaused(!this.paused);
    }
    updateGame(dt) {
      if (this.paused) return;
      this.comboTimer += dt;
      if (this.comboTimer > 1200) {
        this.combo = 0;
        this.comboMultiplier = 1;
      }
      if (this.mode !== 'tutorial') {
        this.timeLeft -= dt/1000;
        if (this.timeLeft <= 0) {
          this.finishRun();
          return;
        }
      }
      this.conveyor.update(dt);
      this.spawner.update(dt, (data)=>this.spawnItem(data));
      for (const item of this.items) {
        if (!item.dragging) {
          item.x -= this.conveyor.speed * dt/1000;
        }
      }
      this.items = this.items.filter(item=>item.x > -100);
      if (this.activePower) {
        this.activePower.update(dt);
        if (!this.activePower.active) {
          this.activePower = null;
          this.powerDirty = true;
        }
      }
      this.particles.update(dt);
      if (this.mode==='tutorial') this.updateTutorial(dt);
      if (this.mode==='infinite') {
        this.score += dt * 0.5;
      }
    }
    spawnItem(data) {
      const sprite = categories.find(c=>c.id===data.category) || categories[0];
      const item = new Item(data, sprite);
      item.x = this.canvas.width + 60;
      item.y = this.canvas.height - 220;
      item.vx = this.conveyor.speed;
      item.vy = 0;
      this.items.push(item);
    }
    updateTutorial(dt) {
      if (this.tutorialStep === 0 && this.hits >= 1) {
        this.tutorialStep = 1;
        this.toasts.push('¡Genial! Toca el power-up para usarlo');
      }
      if (this.tutorialStep === 1 && this.powerInventory.length>0) {
        this.activatePower(0);
        this.tutorialStep = 2;
        this.toasts.push('¡Tutorial completado!');
      }
    }
    finishRun() {
      const accuracy = this.hits + this.errors ? this.hits / (this.hits + this.errors) : 1;
      const stars = accuracy >= 0.9 && this.score > 1200 ? 3 : accuracy >= 0.75 ? 2 : this.errors < 5 ? 1 : 0;
      const coins = Math.floor(this.score/10 + this.comboMultiplier*15);
      this.save.state.inventory.coins += coins;
      if (this.mode==='level') {
        this.save.state.progress.levels[this.currentLevel] = { stars, score: this.score };
      }
      if (this.mode==='infinite') {
        const inf = this.save.state.infinite;
        inf.bestScore = Math.max(inf.bestScore, Math.floor(this.score));
        inf.maxCombo = Math.max(inf.maxCombo, this.combo);
        inf.maxSpeed = Math.max(inf.maxSpeed, this.conveyor.speed/100);
      }
      this.save.save();
      this.director.adjustAfterOutcome({ accuracy, pace: clamp(this.timeLeft/60,0,1), errors: this.errors });
      this.sceneManager.go('results', { stars, score: Math.floor(this.score), accuracy, maxCombo: this.combo, timeLeft: Math.max(0,this.timeLeft), coins });
    }
    retryLevel() {
      this.sceneManager.go('play');
    }
    nextLevel() {
      if (this.mode==='level') {
        this.currentLevel = Math.min(100, this.currentLevel+1);
        this.sceneManager.go('play');
      } else {
        this.sceneManager.go('home');
      }
    }
    toggleDebug() {
      if (!this.debug.overlay) {
        const overlay = document.createElement('div');
        overlay.style.position='absolute';
        overlay.style.top='1rem';
        overlay.style.right='1rem';
        overlay.style.background='rgba(0,0,0,0.6)';
        overlay.style.color='white';
        overlay.style.padding='1rem';
        overlay.style.borderRadius='12px';
        overlay.style.fontSize='0.9rem';
        overlay.style.pointerEvents='auto';
        overlay.innerHTML = `<div>FPS: <span data-fps>0</span></div>
          <div>Seed: <span data-seed>${this.seed}</span></div>
          <div>Skill: <span data-skill>${this.director.skillRating}</span></div>
          <label>Velocidad cinta <input type="range" min="80" max="400" value="${this.conveyor.speed}" data-speed></label>
          <button data-reroll class="btn secondary" style="margin-top:0.5rem">Re-roll seed</button>`;
        overlay.querySelector('[data-speed]').addEventListener('input', (ev)=>{
          this.conveyor.speed = parseFloat(ev.target.value);
        });
        overlay.querySelector('[data-reroll]').addEventListener('click', ()=>{
          this.director = new AILevelDirector(Math.floor(Math.random()*99999999), this.save, this.save.state.settings);
          this.sceneManager.go('play');
        });
        this.uiRoot.append(overlay);
        this.debug.overlay = overlay;
      }
      this.debug.visible = !this.debug.visible;
      this.debug.overlay.style.display = this.debug.visible ? 'block' : 'none';
    }
    loop(now) {
      const dt = now - this.lastFrame;
      this.lastFrame = now;
      this.sceneManager.update(dt);
      if (this.sceneManager.currentId === 'play') {
        this.updateGame(dt);
      }
      this.render();
      if (this.debug.visible && this.debug.overlay) {
        this.debug.overlay.querySelector('[data-fps]').textContent = (1000/dt).toFixed(0);
        this.debug.overlay.querySelector('[data-seed]').textContent = `${this.seed}`;
        this.debug.overlay.querySelector('[data-skill]').textContent = `${this.director.skillRating.toFixed(0)}`;
      }
      requestAnimationFrame(this.loop.bind(this));
    }
    render() {
      const ctx = this.ctx;
      ctx.clearRect(0,0,this.canvas.width,this.canvas.height);
      this.drawWarehouse(ctx);
      for (const bin of this.bins) {
        bin.render(ctx);
      }
      for (const item of this.items) {
        item.render(ctx);
      }
      this.particles.render(ctx);
      this.renderHud();
    }
    drawWarehouse(ctx) {
      const w = this.canvas.width;
      const h = this.canvas.height;
      const beltTop = h - 180;
      const wallGrad = ctx.createLinearGradient(0, 0, 0, h);
      wallGrad.addColorStop(0, '#f4f6ff');
      wallGrad.addColorStop(1, '#ccd6ff');
      ctx.fillStyle = wallGrad;
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = 'rgba(70,90,160,0.08)';
      for (let i=0;i<5;i++) {
        const y = 80 + i*90;
        ctx.fillRect(60, y, w-120, 8);
      }
      ctx.fillStyle = '#d8def7';
      ctx.fillRect(0, beltTop, w, 180);
      const beltGrad = ctx.createLinearGradient(0, beltTop+40, 0, h);
      beltGrad.addColorStop(0, '#5464b9');
      beltGrad.addColorStop(1, '#2f376f');
      ctx.fillStyle = beltGrad;
      ctx.fillRect(0, h-120, w, 120);
      ctx.save();
      ctx.globalAlpha = 0.2;
      ctx.fillStyle = '#ffffff';
      const stride = 140;
      const offset = (Date.now()/10)%stride;
      for (let x=-stride; x<w+stride; x+=stride) {
        ctx.fillRect(x+offset, h-140, 60, 40);
      }
      ctx.restore();
    }
    renderHud() {
      if (!this.hudElements) {
        const hud = document.createElement('div');
        hud.id = 'hud';
        hud.className = 'hud';

        const scorePanel = document.createElement('div');
        scorePanel.className = 'hud-panel';
        const scoreLabel = document.createElement('strong');
        const scoreValue = document.createElement('span');
        scorePanel.append(scoreLabel, scoreValue);

        const comboPanel = document.createElement('div');
        comboPanel.className = 'hud-panel';
        const comboLabel = document.createElement('strong');
        const comboValue = document.createElement('span');
        comboPanel.append(comboLabel, comboValue);

        const timePanel = document.createElement('div');
        timePanel.className = 'hud-panel';
        const timeLabel = document.createElement('strong');
        const timeValue = document.createElement('span');
        timePanel.append(timeLabel, timeValue);

        const pauseBtn = document.createElement('button');
        pauseBtn.className = 'btn ghost icon-only';
        pauseBtn.innerHTML = '⏸';
        pauseBtn.addEventListener('click',()=>this.togglePause());
        pauseBtn.setAttribute('aria-label', I18n.t('ui.pause'));

        const powerRow = document.createElement('div');
        powerRow.className = 'power-row';

        hud.append(scorePanel, comboPanel, timePanel, pauseBtn);
        hud.append(powerRow);
        this.uiRoot.append(hud);
        this.hudElements = {
          root: hud,
          scoreLabel,
          scoreValue,
          comboLabel,
          comboValue,
          comboPanel,
          timeLabel,
          timeValue,
          powerRow,
          pauseBtn
        };
      }
      const { root, scoreLabel, scoreValue, comboLabel, comboValue, comboPanel, timeLabel, timeValue } = this.hudElements;
      const inPlay = this.sceneManager.currentId === 'play';
      root.classList.toggle('is-hidden', !inPlay);
      scoreLabel.textContent = I18n.t('stat.score');
      comboLabel.textContent = I18n.t('stat.combo');
      timeLabel.textContent = I18n.t('stat.time');
      this.hudElements.pauseBtn.setAttribute('aria-label', I18n.t('ui.pause'));
      if (!inPlay) return;
      const locale = I18n.lang === 'es' ? 'es-ES' : 'en-US';
      scoreValue.textContent = Math.floor(this.score).toLocaleString(locale);
      comboValue.textContent = `x${this.comboMultiplier}`;
      if (this.comboMultiplier > 1) {
        comboPanel.dataset.pop = 'true';
      } else {
        delete comboPanel.dataset.pop;
      }
      timeValue.textContent = this.timeLeft.toFixed(1);
      if (this.powerDirty) {
        this.updatePowerRow();
      }
    }
    updatePowerRow() {
      if (!this.hudElements) return;
      const row = this.hudElements.powerRow;
      row.innerHTML = '';
      if (this.powerInventory.length === 0) {
        const placeholder = document.createElement('span');
        placeholder.className = 'power-placeholder';
        placeholder.textContent = I18n.lang === 'es' ? 'Sin power-ups' : 'No power-ups';
        row.append(placeholder);
      } else {
        this.powerInventory.forEach((power, idx)=>{
          const btn = document.createElement('button');
          btn.className = 'btn secondary power-chip';
          btn.innerHTML = `<span>${powerUps[power.type].icon}</span>`;
          btn.addEventListener('click',()=>this.activatePower(idx));
          row.append(btn);
        });
      }
      if (this.activePower && this.activePower.active) {
        const active = document.createElement('div');
        active.className = 'power-active';
        const label = I18n.lang === 'es' ? 'Activo' : 'Active';
        active.innerHTML = `<span>${powerUps[this.activePower.type].icon}</span><span>${label}</span>`;
        row.append(active);
      }
      this.powerDirty = false;
    }
  }

  window.addEventListener('load', ()=>{
    new Game();
  });

  // Tests ligeros
  console.assert(Math.abs(new SeededRandom(123).next() - 0.17893782751075923) < 1e-6, 'PRNG determinista');
  const dir = new AILevelDirector(999, { state: defaultSave() }, {});
  const plan = dir.composeWavePlan({ level: 5, mode: 'level', skillRating: 1200, screen: { w: 1280, h: 720 } });
  console.assert(plan.spawns.length > 5, 'Plan genera ítems');
})();
  </script>
</body>
